rules:
  - id: mado.python.eval-use
    languages: [generic]
    message: Avoid eval() because it can execute attacker-controlled input.
    severity: ERROR
    pattern-regex: '\beval\s*\('

  - id: mado.generic.shell-true
    languages: [generic]
    message: Avoid shell=True because it increases command-injection risk.
    severity: ERROR
    pattern-regex: 'shell\s*=\s*True'

  - id: mado.generic.hardcoded-secret
    languages: [generic]
    message: Hardcoded secret-like value found in source code.
    severity: WARNING
    pattern-regex: '(?i)\b(api[_-]?key|secret|password|token)\s*[:=]\s*["''][^"'']{8,}["'']'
  - id: mado.python.os-system
    languages: [generic]
    message: Avoid os.system() calls; prefer subprocess with explicit args.
    severity: WARNING
    pattern-regex: '\bos\.system\s*\('

  - id: mado.python.requests-verify-false
    languages: [generic]
    message: Requests call with verify=False disables TLS verification.
    severity: ERROR
    pattern-regex: 'verify\s*=\s*False'
  - id: mado.python.pickle-load
    languages: [generic]
    message: Using pickle.load on untrusted data can lead to remote code execution.
    severity: ERROR
    pattern-regex: '\bpickle\.loads?\s*\('

  - id: mado.python.exec-use
    languages: [generic]
    message: Avoid exec(); it can execute attacker-controlled code.
    severity: ERROR
    pattern-regex: '\bexec\s*\('

  - id: mado.python.subprocess-shell-true
    languages: [generic]
    message: subprocess call with shell=True is vulnerable to injection.
    severity: ERROR
    pattern-regex: 'subprocess\.[A-Za-z_]+\s*\(.*shell\s*=\s*True'

  - id: mado.python.sql-string-concat
    languages: [generic]
    message: SQL query constructed via string concatenation may be vulnerable to injection.
    severity: WARNING
    pattern-regex: '(?i)execute\s*\(.*\+.*\)'