name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy)
        run: mypy src

      - name: Tests (pytest)
        run: pytest

      - name: Install optional scanners
        run: pip install semgrep bandit pip-audit

      - name: Self-scan (mado scan)
        id: self-scan
        continue-on-error: true
        run: mado scan . --severity critical --format sarif --output mado.sarif

      - name: Upload Madó SARIF
        if: always() && hashFiles('mado.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mado.sarif

      - name: Enforce self-scan result
        if: steps.self-scan.outcome == 'failure'
        run: exit 1